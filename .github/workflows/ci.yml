name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: install asset validation deps
        run: python -m pip install --upgrade pip jsonschema fonttools
      - name: validate assets
        run: python scripts/validate_assets.py
      - name: verify asset integrity
        run: python scripts/verify_integrity.py
      - name: xtask gen (check)
        run: cargo xtask gen --check
      - name: cargo test (xtask)
        run: cargo test -p xtask
      - name: cargo build (examples)
        run: cargo build --examples --all-features
      - name: cargo test (no default features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --no-default-features
      - name: cargo test (all features)
        run: cargo test --all-features
      - name: install cargo-hack
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-hack
      - name: cargo hack (feature powerset)
        if: matrix.os == 'ubuntu-latest'
        run: cargo hack test --feature-powerset --depth 2 --exclude-features all-packs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - run: cargo check --all-features

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - run: cargo package --list
      - run: cargo publish --dry-run

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - uses: taiki-e/install-action@cargo-about
      - run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES_CRATES.html
      - run: git diff --exit-code -- THIRD_PARTY_LICENSES_CRATES.html

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - run: cargo bench --bench lookup --no-run --features "pack-phosphor,pack-tabler,pack-fluentui"
