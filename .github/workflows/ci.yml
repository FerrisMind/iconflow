name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: install asset validation deps
        run: python -m pip install --upgrade pip jsonschema fonttools
      - name: validate assets
        run: python scripts/validate_assets.py
      - name: verify asset integrity
        run: python scripts/verify_integrity.py
      - name: xtask gen (check)
        run: cargo xtask gen --check
      - name: cargo test (xtask)
        run: cargo test -p xtask
      - name: cargo build (examples)
        run: cargo build --examples --all-features
      - name: cargo test (no default features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --no-default-features
      - name: cargo test (all features)
        run: cargo test --all-features
      - name: install cargo-hack
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-hack
      - name: cargo hack (feature powerset)
        if: matrix.os == 'ubuntu-latest'
        run: cargo hack test --feature-powerset --depth 2 --exclude-features all-packs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  # Pinned MSRV == CI toolchain (1.92.0 / rust-version "1.92").
  # Not an independent older-toolchain drift guard — this job *is* the declared MSRV.
  msrv:
    name: pinned MSRV (== CI toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - run: cargo check --locked --all-features

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - run: cargo package --list
      - run: cargo publish --dry-run

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      # CI adapts to project (N-C-1 / D5 / D-R3-04): committed HTML is authoritative.
      # Generate into RUNNER_TEMP so Ubuntu cargo-about never overwrites the committed file.
      # Policy hard-fail remains cargo-about's about.toml `accepted` list (generate exits non-zero).
      # Freshness: CR-stripped + trailing-whitespace-trimmed text compare (not git diff / raw bytes).
      # Fonts MD is hand-maintained (not cargo-about); presence-only via test -s.
      - name: verify dependency licenses against about.toml
        run: cargo about generate about.hbs -o "${RUNNER_TEMP}/THIRD_PARTY_LICENSES_CRATES.html"
      - name: committed third-party license HTML present
        run: test -s THIRD_PARTY_LICENSES_CRATES.html
      - name: committed crates HTML matches TEMP (normalized)
        run: |
          normalize() {
            tr -d '\r' < "$1" | sed 's/[[:space:]]*$//'
          }
          diff -u \
            <(normalize THIRD_PARTY_LICENSES_CRATES.html) \
            <(normalize "${RUNNER_TEMP}/THIRD_PARTY_LICENSES_CRATES.html")
      - name: committed fonts license markdown present
        run: test -s THIRD_PARTY_LICENSES_FONTS.md

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
      - run: cargo bench --bench lookup --no-run --features "pack-phosphor,pack-tabler,pack-fluentui,pack-feather"
