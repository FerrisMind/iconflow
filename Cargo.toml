[package]
name = "iconflow"
version = "2.0.0"
edition = "2024"
rust-version = "1.92"
description = "Unified icon library for Rust GUI apps with 10+ embedded icon packs (Bootstrap, Heroicons, Phosphor, Lucide, Tabler). Type-safe API for egui, iced and more"
license = "MIT"
repository = "https://github.com/FerrisMind/iconflow"
authors = ["FerrisMind"]
readme = "README.md"
keywords = ["icons", "gui", "egui", "iced", "fonts"]
categories = ["gui", "graphics", "rendering", "visualization", "embedded"]
homepage = "https://github.com/FerrisMind/iconflow"
documentation = "https://docs.rs/iconflow"

include = [
    "/src/**/*",
    "/assets/fonts/**/*.ttf",
    "/assets/icons/*.png",
    "/assets/icons/*.svg",
    "/ASSETS_MANIFEST.json",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/Cargo.toml",
    "/rust-toolchain.toml",
    "/THIRD_PARTY_LICENSES_FONTS.md",
]

[dependencies]

[dev-dependencies]
eframe = "0.33"
iced = { version = "0.14", features = ["advanced"] }
criterion = "0.5"

[features]
default = []
pack-bootstrap = []
pack-carbon = []
pack-devicon = []
pack-feather = []
pack-fluentui = []
pack-heroicons = []
pack-iconoir = []
pack-ionicons = []
pack-lobe = []
pack-lucide = []
pack-octicons = []
pack-phosphor = []
pack-remixicon = []
pack-tabler = []
heroicons-tiny = ["pack-heroicons"]
heroicons-mini = ["pack-heroicons"]
octicons-tiny = ["pack-octicons"]
all-packs = [
  "pack-bootstrap",
  "pack-carbon",
  "pack-devicon",
  "pack-feather",
  "pack-fluentui",
  "pack-heroicons",
  "pack-iconoir",
  "pack-ionicons",
  "pack-lobe",
  "pack-lucide",
  "pack-octicons",
  "pack-phosphor",
  "pack-remixicon",
  "pack-tabler",
  "heroicons-tiny",
  "heroicons-mini",
  "octicons-tiny",
]

[workspace]
members = ["xtask"]
resolver = "3"

[[example]]
name = "egui_demo"
path = "examples/v1.0/egui_demo/main.rs"
required-features = ["all-packs"]

[[example]]
name = "iced_demo"
path = "examples/v1.0/iced_demo/main.rs"
required-features = ["all-packs"]

[[bench]]
name = "lookup"
harness = false
required-features = ["pack-phosphor", "pack-tabler", "pack-fluentui", "pack-feather"]

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.bench]
strip = "none"
panic = "unwind"

[lints.clippy]
all = { level = "warn", priority = -1 }
